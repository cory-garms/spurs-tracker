name: Spurs Tracker Master Pipeline

on:
  schedule:
    # Run daily at 05:00 UTC (12:00 AM Central / post-game wrap)
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      refresh_remote:
        description: "Force pull live data from stats.nba.com"
        required: false
        type: boolean
        default: false

jobs:
  build-and-deploy:
    name: Run Analytical Pipeline & Update Portals
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Execute Master Pipeline
        run: |
          if [ "${{ github.event.inputs.refresh_remote }}" = "true" ]; then
            python pipeline.py --refresh --verbose
          else
            python pipeline.py --skip-fetch --verbose
          fi

      - name: Run Analytical Test Suite
        run: |
          pytest -v

      - name: Commit and Push Updated Dashboards & Cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/cache/
          if git diff --staged --quiet; then
            echo "No analytical changes to commit."
          else
            git commit -m "chore(pipeline): automated analytics, static APIs & dashboard refresh [skip ci]"
            git push
          fi
